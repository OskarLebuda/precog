name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub Pages serves this repository under /precog/, so the bundled assets need
      # that prefix or every one of them 404s and the page renders blank.
      - run: pnpm docs:build
        env:
          NUXT_APP_BASE_URL: /precog/
      # undocs writes its logo and favicon from the domain root, which the base URL misses.
      - run: node scripts/fix-docs-base.mjs
        env:
          NUXT_APP_BASE_URL: /precog/
      # Pages must already be enabled with "GitHub Actions" as the source. The default
      # GITHUB_TOKEN cannot create the site itself, so `enablement: true` does not help.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
