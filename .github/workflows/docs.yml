name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The root tsconfig extends `.nuxt/tsconfig.json`, which is generated. undocs loads its
      # app from this repo's node_modules, so its build resolves that tsconfig too.
      - run: pnpm exec nuxt-module-build prepare
      - run: pnpm docs:build
      # Pages must already be enabled with "GitHub Actions" as the source. The default
      # GITHUB_TOKEN cannot create the site itself, so `enablement: true` does not help.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
