name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # The only credential this workflow uses. There is no npm token anywhere.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No `registry-url`: it makes setup-node write an .npmrc with a placeholder auth token,
      # and npm then treats that as a credential instead of falling back to the OIDC exchange.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or newer; Node 24 ships close, so pin it.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm check
      - run: pnpm build
      # Core first, so a fresh scope gets its dependency before the adapters that name it.
      #
      # `pnpm pack` rather than `npm publish` on the directory: the manifests depend on each
      # other through `workspace:*`, which pnpm rewrites to the real version while packing and
      # npm ships verbatim, producing a tarball nobody can install.
      #
      # No NODE_AUTH_TOKEN: the OIDC id-token is the credential, and npm attaches build
      # provenance by itself. Publishing an already-published version is skipped rather than
      # failed, so a tag can cover a subset of the workspace.
      - name: Publish every package whose version is new
        run: |
          set -euo pipefail
          for pkg in core nuxt next; do
            dir="packages/$pkg"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, nothing to publish."
              continue
            fi
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)
            echo "Publishing $name@$version from $tarball"
            npm publish "$tarball" --access public --ignore-scripts
          done
