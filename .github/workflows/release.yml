name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # The only credential this workflow uses. There is no npm token anywhere.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 24 ships close, so pin it.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm check
      - run: pnpm build
      # No NODE_AUTH_TOKEN: the OIDC id-token is the credential, and npm attaches build
      # provenance by itself. Scripts are skipped because the build already ran above.
      # The version check keeps a tag pushed for an already-published version from failing,
      # which is what happens to the first release, published by hand.
      - name: Publish when the version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "nuxt-precog@$VERSION" version >/dev/null 2>&1; then
            echo "nuxt-precog@$VERSION is already on npm, nothing to publish."
            exit 0
          fi
          npm publish --ignore-scripts
